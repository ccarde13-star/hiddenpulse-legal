<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok OAuth Callback</title>
<style>
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#15161a; color:#eceae5; display:flex; align-items:center;
    justify-content:center; min-height:100vh; margin:0; padding:24px;
  }
  .card{
    max-width:640px; width:100%; background:#1c1e23; border:1px solid #2c2e34;
    border-radius:12px; padding:32px;
  }
  h1{font-size:20px; margin:0 0 16px;}
  .label{font-size:13px; color:#a7a49c; margin-bottom:6px;}
  .box{
    background:#23252b; border:1px solid #2c2e34; border-radius:8px;
    padding:14px 16px; word-break:break-all; font-family:monospace;
    font-size:14px; margin-bottom:20px; user-select:all;
  }
  .err{color:#ff8a8a;}
  button{
    background:#4fd9bd; color:#0b0c0e; border:none; border-radius:8px;
    padding:10px 18px; font-weight:600; cursor:pointer; font-size:14px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Código de autorización recibido</h1>
    <div id="content"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const errorDesc = params.get('error_description');
    const el = document.getElementById('content');
    if (code) {
      el.innerHTML = `
        <p class="label">Copia este código y pégalo en el chat:</p>
        <div class="box" id="codebox">${code}</div>
        <button onclick="navigator.clipboard.writeText(document.getElementById('codebox').textContent)">Copiar</button>
      `;
    } else if (error) {
      el.innerHTML = `<p class="err">Error: ${error}</p><p>${errorDesc || ''}</p>`;
    } else {
      el.innerHTML = `<p class="err">No se recibió ningún código en la URL.</p>`;
    }
  </script>
</body>
</html>
